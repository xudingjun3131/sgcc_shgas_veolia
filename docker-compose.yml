services:
  sgcc_electricity_app:
    env_file:
      - .env
    image: xudingjun3131/sgcc_shgas_veolia:v1.0 # for use docker.io: arcw/sgcc_electricity:latest
    # image: sgcc_electricity_test      # for local test
    container_name: sgcc_shgas_veolia
    network_mode: "host"
    environment:
      - SET_CONTAINER_TIMEZONE=true
      - CONTAINER_TIMEZONE=Asia/Shanghai
    restart: unless-stopped
    volumes:
      - ./:/data        # if you want to read homeassistant.db, homeassistant.db is in the container at /data/
    command: python3 main.py
    init: true
